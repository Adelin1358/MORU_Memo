<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div id="wrap" >
        <header class=" d-flex align-items-center">
            <h1 class="ml-3">Memo</h1>
        </header>
        <section class="contents  d-flex justify-content-center">
            <div class="user-box  p-4 my-5 rounded-lg">
                <h1 class="text-center">회원 가입</h1>
                <input type="text" class="form-control mt-3" placeholder="아이디" id="loginIdInput">
                <input type="password" class="form-control mt-2" placeholder="비밀번호" id="passwordInput">
                <input type="password" class="form-control mt-2" placeholder="비밀번호 확인" id="passwordConfirmInput">
                <input type="text" class="form-control mt-2" placeholder="이름" id="nameInput">
                <input type="text" class="form-control mt-2" placeholder="이메일" id="emailInput">
                <button type="button" class="btn btn-secondary btn-block mt-2" id="joinBtn">가입</button>
            </div>
        </section>
        <footer class=" d-flex align-items-center justify-content-center">
            <div>Copyright 2025. MORU All rights reserved.</div>
        </footer>
    </div>
</body>

<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
<script>
    $("#joinBtn").on("click",function(){
        let loginId = $("#loginIdInput").val();
        let password = $("#passwordInput").val();
        let passwordConfirm = $("#passwordConfirmInput").val();
        let name = $("#nameInput").val();
        let email = $("#emailInput").val();

        if(loginId == ""){
            alert("아이디를 입력하세요");
            return ;
        }

        if(password == ""){
            alert("비밀번호를 입력하세요");
            return ;
        }

        if(password != passwordConfirm){
            alert("비밀번호가 일치하지 않습니다.");
            return ;
        }

        if(name == ""){
            alert("이름를 입력하세요");
            return ;
        }

        if(email == ""){
            alert("이메일를 입력하세요");
            return ;
        }

        $.ajax({
            type:"post"
            , url:"user/join-process"
            , data:{"loginId":loginId, "password":password, "name":name, "email":email}
            , success:function(response) {
                if(response.result == "success"){
                   location.href = "/user/login";
                }else{
                    alert("회원가입 실패!!");
                }
            }
            , error:function() {
                alert("회원 가입 에러")
            }
        });

    });
</script>

</html>
